<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6EF" />
<meta name="format-detection" content="telephone=no" />
<title>抽签排序</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C1413A'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E7%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1 id="appTitle">抽签排序</h1>
      <p id="appSub">每人一个不重复的号</p>
    </div>
    <span class="status" id="appStatus">进行中</span>
  </header>

  <main id="main">
    <div class="loading">载入中…</div>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="draw" aria-label="抽签">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M8.5 6v12M15.5 6v12"/></svg>
      <span>抽签</span>
    </button>
    <button class="tab" data-tab="swap" aria-label="换号">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5h13l-3.2-3.2M20.5 15.5h-13l3.2 3.2"/></svg>
      <span>换号</span>
      <i class="badge" id="swapBadge" hidden>0</i>
    </button>
    <button class="tab" data-tab="admin" aria-label="管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
      <span>管理</span>
    </button>
  </nav>
</div>

<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
